<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar produto</title>
</head>

<body>

    <header>
        <h1>Cadastrar produto</h1>
        <p>Preencha os campos abaixo para adicionar um novo produto ao estoque.</p>
    </header>

    <main>
        <section>
            <h2>Informações do produto</h2>

            <form method="post">

                <fieldset>
                    <legend>Dados do produto</legend>

                    <p>
                        <label for="title">Nome do produto:</label><br>
                        <input type="text" name="title" id="title" required>
                    </p>

                    <p>
                        <label for="quantity">Quantidade:</label><br>
                        <input type="number" name="quantity" id="quantity" min="0" required>
                    </p>

                    <p>
                        <label for="price">Preço (R$):</label><br>
                        <input type="number" name="price" id="price" step="0.01" min="0" required>
                    </p>

                </fieldset>

                <p>
                    <button type="submit">Cadastrar produto</button>
                </p>

            </form>
        </section>
    </main>

    <footer>
        <hr>
        <p>Sistema de gerenciamento de produtos</p>
    </footer>

</body>
</html>
